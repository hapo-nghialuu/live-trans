name: mobile-builds

on:
  push:
    branches: [build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/platforms/android-37.0
            /usr/local/lib/android/sdk/build-tools/37.0.0
            /usr/local/lib/android/sdk/platform-tools
          key: android-sdk-${{ hashFiles('mobile/android/build.gradle') }}

      - name: Android SDK packages
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Install JS deps
        working-directory: mobile
        run: npm ci

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Cache CocoaPods
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: |
            mobile/ios/Pods
            ~/.cocoapods
          key: pods-${{ hashFiles('mobile/ios/Podfile.lock', 'mobile/package-lock.json') }}

      - name: Install JS deps
        working-directory: mobile
        run: npm ci

      - name: Pod install
        working-directory: mobile/ios
        run: pod install

      - name: Archive unsigned IPA
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace LiveTransMic.xcworkspace -scheme LiveTransMic \
            -configuration Release -destination generic/platform=iOS \
            -archivePath LiveTransMic.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -25
          mkdir -p Payload
          cp -R "LiveTransMic.xcarchive/Products/Applications/LiveTransMic.app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LiveTransMic.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: mobile/ios/LiveTransMic.ipa
          retention-days: 5

  release:
    needs: [apk, ipa]
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Compute next version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release list --limit 20 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0] // empty')
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3]+1))"
          else
            tag="v0.1.0"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cp dist/apk/app-debug.apk "LiveTransMic-${TAG}.apk"
          cp dist/ipa/LiveTransMic.ipa "LiveTransMic-${TAG}-unsigned.ipa"
          gh release create "$TAG" "LiveTransMic-${TAG}.apk" "LiveTransMic-${TAG}-unsigned.ipa" \
            --title "LiveTransMic ${TAG}" \
            --generate-notes \
            --prerelease
